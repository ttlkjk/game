<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DosiCare 암 퇴치 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one fixed portrait "console" (400x800 logical) scaled to fit; canvas on top, control bar below, DOM overlays for menus.
   Look: dark treatment-planning-system screen. Single dark theme on purpose. */
:root{
  --bg:#06080b; --panel:#0d1217; --panel2:#141c23; --line:#25333d;
  --fg:#dbe5ea; --dim:#7f919d; --accent:#2fd3c5; --warn:#ffb347; --danger:#ff4d5e;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-logo:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:var(--font-ui);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#game{--s:1;position:relative;width:400px;height:800px;font-size:calc(16px*var(--s));background:var(--bg);overflow:hidden}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(100% * 140 / 800);box-sizing:border-box;
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1.15fr .85fr;gap:.35em;padding:.45em .5em .55em;
  background:var(--panel);border-top:1px solid var(--line)}
.wbtn,.sbtn{position:relative;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
  border-radius:.6em;font:inherit;padding:.3em .2em;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.15em;touch-action:manipulation;cursor:pointer;overflow:hidden}
.wbtn .nm{font-weight:700;font-size:.95em;line-height:1.1}
.wbtn .sub{font-family:var(--font-num);font-size:.58em;color:var(--dim);letter-spacing:.02em;white-space:nowrap}
.wbtn .ico{width:1.7em;height:1.1em}
.wbtn .g{position:absolute;left:.4em;right:.4em;bottom:.3em;height:.18em;border-radius:1em;background:#1f2a32;overflow:hidden}
.wbtn .g i{display:block;height:100%;width:100%;background:var(--accent)}
.wbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 .8em rgba(47,211,197,.25)}
.wbtn.on .nm{color:var(--accent)}
.sbtn{--cd:0;--ca:var(--accent);border-color:var(--ca);grid-column:span 3}
.abtn{--ca:#7ef3c8;grid-column:span 2}
.sbtn::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(4,6,8,.72) calc(var(--cd)*360deg),transparent 0);pointer-events:none}
.sbtn .nm{font-weight:700;font-size:.9em;color:var(--ca)}
.sbtn .st{font-family:var(--font-num);font-size:.62em;color:var(--dim)}
.sbtn.ready{box-shadow:0 0 1em color-mix(in srgb,var(--ca) 35%,transparent)}
.sbtn.active{background:color-mix(in srgb,var(--ca) 22%,var(--panel2))}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pause{position:absolute;top:.35em;right:.4em;width:2.1em;height:2.1em;border-radius:.5em;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font:inherit;font-size:1em;display:flex;align-items:center;justify-content:center;gap:.2em;cursor:pointer}
#pause i{display:block;width:.22em;height:.75em;background:var(--fg);border-radius:.05em}
#pause[hidden]{display:none}
.screen{position:absolute;inset:0;z-index:5;box-sizing:border-box;padding:1.2em 1.1em;overflow-y:auto;
  background:rgba(6,8,11,.88);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;flex-direction:column;
  justify-content:center;gap:.9em;touch-action:pan-y}
.screen[hidden]{display:none}
.logo{font-family:var(--font-logo);font-weight:400;font-size:2.7em;line-height:1;letter-spacing:.01em;margin:0;text-align:center;
  background:linear-gradient(180deg,#e9fffd 0%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{background:#fff;border-radius:.9em;padding:.55em .9em;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 .6em 2em rgba(47,211,197,.12)}
.brand img{display:block;width:100%;height:auto}
.brand.sm{width:55%;margin:0 auto;padding:.35em .6em;border-radius:.6em}
.tag{font-family:var(--font-num);font-size:.68em;letter-spacing:.18em;color:var(--dim);text-align:center;text-transform:uppercase}
.lead{font-size:1.05em;text-align:center;margin:0;line-height:1.5;text-wrap:balance}
h2{font-family:var(--font-logo);font-weight:400;font-size:1.9em;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:.8em;margin:0;color:var(--dim);font-family:var(--font-num);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
p{margin:0;line-height:1.55;font-size:.92em}
.dim{color:var(--dim)}
.btn{font:inherit;font-weight:700;font-size:1.05em;border-radius:.65em;border:1px solid var(--accent);background:var(--accent);color:#04201e;
  padding:.8em 1em;cursor:pointer;touch-action:manipulation;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.35}
.row{display:flex;gap:.6em}
.row .btn{flex:1}
.cards{display:flex;flex-direction:column;gap:.6em}
.card{font:inherit;color:var(--fg);text-align:left;display:grid;grid-template-columns:4.4em 1fr;gap:.8em;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:.8em;padding:.7em;cursor:pointer;touch-action:manipulation}
.card svg{width:4.4em;height:4.4em;display:block}
.card .cn{font-weight:700;font-size:1.1em}
.card .cr{font-size:.72em;color:var(--dim);margin-left:.35em;font-weight:400}
.card .cs{font-size:.8em;margin-top:.25em;line-height:1.45}
.card .cs b{color:var(--ca)}
.card .cp{font-size:.72em;color:var(--dim);margin-top:.2em}
.card.sel{border-color:var(--ca);box-shadow:inset 0 0 0 1px var(--ca)}
.chips{display:flex;flex-wrap:wrap;gap:.35em}
.chip{font-family:var(--font-num);font-size:.7em;border:1px solid var(--c,var(--line));color:var(--c,var(--fg));border-radius:2em;padding:.2em .6em;white-space:nowrap}
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:.8em;padding:.8em .9em;display:flex;flex-direction:column;gap:.55em}
.dvh{display:grid;grid-template-columns:5.6em 1fr 5.4em;gap:.5em;align-items:center;font-size:.8em}
.dvh .bar{height:.5em;background:#1d2830;border-radius:1em;position:relative;overflow:hidden}
.dvh .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:1em}
.dvh .v{font-family:var(--font-num);text-align:right;font-variant-numeric:tabular-nums;font-size:.92em}
.grade{font-family:var(--font-logo);font-size:2.6em;line-height:1}
.kv{display:flex;justify-content:space-between;font-size:.85em}
.kv b{font-weight:700;font-variant-numeric:tabular-nums}
.big{font-family:var(--font-num);font-size:1.6em;font-weight:700;color:var(--accent);text-align:center}
.fx{font-family:var(--font-num);color:var(--accent);font-size:.8em;letter-spacing:.12em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="game">
    <canvas id="cv"></canvas>
    <button id="pause" type="button" aria-label="일시정지" hidden><i></i><i></i></button>
    <div id="bar">
      <button class="wbtn on" data-w="x" type="button"><svg class="ico" viewBox="0 0 34 22"><path d="M17 1v20" stroke="#bff6ff" stroke-width="2.4"/><path d="M11 5v13M23 5v13" stroke="#5fd8ff" stroke-width="1.2" opacity=".6"/></svg><span class="nm">X선</span><span class="sub">6 MV</span></button>
      <button class="wbtn" data-w="e" type="button"><svg class="ico" viewBox="0 0 34 22"><g fill="#a99bff"><circle cx="17" cy="4" r="2.2"/><circle cx="9" cy="7" r="2.2"/><circle cx="25" cy="7" r="2.2"/><circle cx="4" cy="12" r="2"/><circle cx="30" cy="12" r="2"/></g><path d="M17 21 17 8M17 21 9 9M17 21 25 9" stroke="#a99bff" stroke-width=".8" opacity=".5"/></svg><span class="nm">전자선</span><span class="sub">9 MeV</span></button>
      <button class="wbtn" data-w="p" type="button"><svg class="ico" viewBox="0 0 34 22"><path d="M17 21V9" stroke="#ff9f6b" stroke-width="1.6" opacity=".55"/><circle cx="17" cy="6" r="4.6" fill="#ff7a59"/><circle cx="17" cy="6" r="2" fill="#fff1d6"/></svg><span class="nm">양성자</span><span class="sub">자동·톡</span><span class="g"><i></i></span></button>
      <button class="wbtn" data-w="i" type="button"><svg class="ico" viewBox="0 0 34 22"><g fill="#7ef3c8"><rect x="3" y="3" width="4" height="16" opacity=".3"/><rect x="9" y="3" width="4" height="16"/><rect x="15" y="3" width="4" height="16"/><rect x="21" y="3" width="4" height="16" opacity=".3"/><rect x="27" y="3" width="4" height="16" opacity=".65"/></g></svg><span class="nm">IMRT</span><span class="sub">MLC 7</span></button>
      <button class="wbtn" data-w="w" type="button"><svg class="ico" viewBox="0 0 34 22"><rect x="9" y="12" width="16" height="9" rx="1.5" fill="none" stroke="#4aa3ff" stroke-width="1.4"/><path d="M10 16h14v4H10z" fill="#4aa3ff" opacity=".55"/><g fill="#7cc4ff"><circle cx="17" cy="7" r="1.6"/><circle cx="12" cy="4" r="1.3"/><circle cx="22" cy="4" r="1.3"/><circle cx="17" cy="1.8" r="1.1"/></g></svg><span class="nm">물대포</span><span class="sub">Phantom</span><span class="g"><i></i></span></button>
      <button class="sbtn" id="sbtn" type="button"><span class="nm" id="sname">특기</span><span class="st" id="sstat">준비</span></button>
      <button class="sbtn abtn" id="abtn" type="button"><span class="nm">RapidArc</span><span class="st" id="astat">0%</span></button>
    </div>
    <div class="screen" id="screen"></div>
  </div>
</div>

function layout() {

  S = Math.max(0.3, Math.min(aw / 400, ah / 800));
  const g = $('#game');
  g.style.setProperty('--s', S);
  g.style.width = 400 * S + 'px'; g.style.height = 800 * S + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * S * DPR); cv.height = Math.round(H * S * DPR);

}

function ell(g, cx, cy, rx, ry, v, a) {
  g.beginPath(); g.ellipse(cx, cy, rx, ry, a || 0, 0, Math.PI * 2);
  if (typeof v === 'number') { v = Math.min(255, Math.round(v * 1.22 + 10)); v = `rgb(${v},${v},${v})`; }
  g.fillStyle = v; g.fill();
}
function dots(g, cx, cy, rx, ry, n, v, rmax) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.9;
    ell(g, cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r, rand(0.6, rmax), rand(0.6, rmax), v + rand(-10, 10));
  }
}
function couch(g, y) {
  g.strokeStyle = 'rgb(150,150,150)'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(10, y + 6); g.quadraticCurveTo(200, y - 6, 390, y + 6); g.stroke();

}

function buildCT(st) {
  const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
  const g = c.getContext('2d'); g.scale(2, 2);
  // viewport background: steel-blue TPS window with a 1 cm (20 px) grid
  const b = st.body;
  const bgG = g.createRadialGradient(b.cx, b.cy, 60, b.cx, b.cy, 430);
  bgG.addColorStop(0, '#1d3d4f'); bgG.addColorStop(0.5, '#122a38'); bgG.addColorStop(1, '#0a1720');
  g.fillStyle = bgG; g.fillRect(0, 0, W, H);
  g.lineWidth = 0.6;
  for (let x = 0; x <= W; x += 20) {
    g.strokeStyle = x % 100 === 0 ? 'rgba(110,200,220,.22)' : 'rgba(110,200,220,.09)';
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
  }
  for (let y = 0; y <= H; y += 20) {
    g.strokeStyle = y % 100 === 0 ? 'rgba(110,200,220,.22)' : 'rgba(110,200,220,.09)';
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  // external contour glow
  g.save(); g.shadowColor = 'rgba(140,235,245,.55)'; g.shadowBlur = 26;
  ell(g, b.cx, b.cy, b.rx, b.ry, '#0b0f12'); g.restore();
  st.ct(g);
  g.beginPath(); g.ellipse(b.cx, b.cy, b.rx + 1.5, b.ry + 1.5, 0, 0, Math.PI * 2);
  g.strokeStyle = 'rgba(120,255,170,.75)'; g.lineWidth = 1.2; g.stroke();
  const id = g.getImageData(0, 0, c.width, c.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] > 10 && Math.abs(d[i] - d[i + 2]) < 3) { const n = (Math.random() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  }
  g.putImageData(id, 0, 0);
  return c;
}

/* dose colorwash: accumulated where beams actually went (8 px cells) */
const DG = 8, GW = Math.ceil(W / DG), GH = Math.ceil(IMG_BOTTOM / DG);
const doseCv = document.createElement('canvas'); doseCv.width = GW; doseCv.height = GH;
const doseCtx = doseCv.getContext('2d'), doseImg = doseCtx.createImageData(GW, GH);
function addDose(x, y, v) {
  if (!G || !inE(x, y, G.st.body)) return;
  const i = (x / DG) | 0, j = (y / DG) | 0;
  if (i < 0 || j < 0 || i >= GW || j >= GH) return;
  G.dg[j * GW + i] += v;
}
function drawDoseWash() {
  const d = doseImg.data, dg = G.dg;
  for (let k = 0; k < dg.length; k++) {
    const f = Math.min(1, dg[k] / 4), o = k * 4;

    const c = isoColor(f);
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 40 + 110 * f;
  }
  doseCtx.putImageData(doseImg, 0, 0);
  ctx.imageSmoothingEnabled = true;

}

/* ============ helpers: messages, particles ============ */
function banner(text, sub, color, dur) {

  if (G.banners.length > 2) G.banners.shift();
}
function ftext(x, y, text, color, size) { G.texts.push({ x, y, text, color: color || '#fff', t: 0, size: size || 11 }); }
function burst(x, y, color, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(20, sp || 140);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, color, size: rand(1, 2.6) });
  }
}

function doseMul() { return 1 + G.drift / 100; }
function depositOAR(o, d, quiet) {
  if (charKey === 'physicist' && G.sp.active > 0) return;
  if (G.clearT >= 0 || state !== 'play') return;
  o.dose += d * o.factor * doseMul();
  if (!quiet) o.flash = 0.22;
  if (o.dose >= o.limit) gameOver('oar', o);
}
function tumorMul(t) {
  let m = doseMul();
  if (charKey === 'doctor') { m *= 1.1; if (G.sp.active > 0) m *= 1.3; }
  if (t && t.kind === 'boss' && t.phase === 3) m *= 0.8;
  return m;
}
function doseTumor(t, d) {
  if (!t.alive) return;
  t.dose += d * tumorMul(t); t.lastHit = G.time; t.flash = 0.08; t.seen = true;
  if (t.dose >= t.rx) {
    t.dose = t.rx; t.alive = false;
    burst(t.x, t.y, '#ff5a6a', t.kind === 'hidden' ? 18 : 60, t.kind === 'hidden' ? 90 : 200);
    G.booms.push({ x: t.x, y: t.y, r: t.r * 2.2, t: 0, dur: 0.6, color: '#ff8090' });
    if (t.kind === 'hidden') { G.score += 500; ftext(t.x, t.y - 12, '미세병변 제거 +500', '#ff9be0', 11); }
    else {
      G.score += 2000; ftext(t.x, t.y - 20, '처방선량 도달!', '#fff', 14);
      if (!G.tumors.some(u => u.alive && u.kind !== 'hidden')) stageClear();
    }
  }
}
function hitCell(c, d) {
  c.hp -= d * tumorMul(null);
  c.flash = 0.08;
  if (c.hp <= 0 && !c.dead) {
    c.dead = true; G.score += 50; G.stats.cells++;
    burst(c.x, c.y, '#ff7a8a', 8, 90);
  }
}
function hurt(n, why) {
  const s = G.ship;
  if (s.inv > 0 || state !== 'play' || G.clearT >= 0) return;
  s.hp -= n; s.inv = 0.8; G.shake = 0.25;
  ftext(s.x, s.y - 30, `-${n} ${why || ''}`.trim(), '#ff6b78', 12);
  burst(s.x, s.y, '#ffb0a0', 10, 120);
  if (s.hp <= 0) { s.hp = 0; gameOver('hp'); }
}

/* ============ weapons ============ */
function jitter() {
  return (Math.random() * 2 - 1) * Math.abs(G.drift) * 1.4 * (charKey === 'therapist' ? 0.5 : 1);
}
function fireX() {
  const s = G.ship;
  G.bullets.push({ type: 'x', x: s.x + jitter(), y: s.y - 26, vx: 0, vy: -720, hits: new Set(), mask: 0, life: 1.2 });
}
function fireE() {
  const s = G.ship;
  for (const deg of [-14, -7, 0, 7, 14]) {
    const a = (deg - 90) * Math.PI / 180;
    G.bullets.push({ type: 'e', x: s.x + jitter(), y: s.y - 24, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, hits: new Set(), mask: 0, travel: 0, range: 245 });
  }
}
function fireW() {
  const s = G.ship;
  const a = (rand(-18, 18) - 90) * Math.PI / 180, v = rand(380, 460);
  G.bullets.push({ type: 'w', x: s.x + rand(-3, 3), y: s.y - 24, vx: Math.cos(a) * v, vy: Math.sin(a) * v, hits: new Set(), mask: 0, travel: 0, range: rand(180, 220) });
}
function fireP(tx, ty) {
  const s = G.ship;
  if (G.pCharge < 1 || G.interlock > 0) {
    // not ready: remember the spot and fire the moment the charge is full
    G.pQueue = { x: tx, y: ty };
    G.cross = { x: tx, y: ty, t: 0, queued: true };
    return;
  }
  G.pCharge = 0; G.pQueue = null;
  const d = dist(s.x, s.y - 26, tx, ty);
  G.bullets.push({ type: 'p', x: s.x, y: s.y - 26, tx, ty, vx: (tx - s.x) / d * 640, vy: (ty - s.y + 26) / d * 640, hits: new Set(), mask: 0, left: d });
  G.cross = { x: tx, y: ty, t: 0 };
}
function protonExplode(x, y) {
  const R = 26;
  G.booms.push({ x, y, r: R * 1.25, t: 0, dur: 0.45, color: '#ff8a5c', bragg: true });
  burst(x, y, '#ffb36b', 22, 160);
  for (let yy = y - R; yy <= y + R; yy += DG) for (let xx = x - R; xx <= x + R; xx += DG) {
    const dd = dist(x, y, xx, yy); if (dd < R) addDose(xx, yy, 1.1 * (1 - dd / R));
  }
  for (const t of G.tumors) if (t.alive && dist(x, y, t.x, t.y) < R + t.r * 0.7) doseTumor(t, 5.5);
  for (const c of G.cells) if (!c.dead && dist(x, y, c.x, c.y) < R + c.r) hitCell(c, 6);
  for (const o of G.oars) {
    const dx = (x - o.cx) / (o.rx + R * 0.6), dy = (y - o.cy) / (o.ry + R * 0.6);
    if (dx * dx + dy * dy <= 1) depositOAR(o, 3.5);
  }
}
const OAR_BASE = { x: 0.3, e: 0.25, p: 0.075, w: 0, i: 0.18, a: 0.12 };

/* IMRT: 7 beamlets; each MLC leaf pair opens by what lies in its column */
function fireI() {
  const s = G.ship, cols = [];
  const targets = G.tumors.filter(t => t.alive && (t.kind !== 'hidden' || t.seen));
  for (let k = -3; k <= 3; k++) {
    const x = s.x + k * 9 + jitter() * 0.5;
    const hasT = targets.some(t => Math.abs(x - t.x) < t.r);
    const inPath = G.oars.filter(o => Math.abs(x - o.cx) < o.rx && o.cy < s.y);
    // serial organs (factor >= 1: cord, rectum, brainstem...) get the leaves nearly shut; parallel organs only trimmed
    let inten;
    if (hasT) inten = inPath.reduce((m, o) => Math.min(m, o.factor >= 1 ? 0.25 : 0.75), 1);
    else inten = inPath.length ? 0 : 0.4;
    cols.push(inten);
    if (inten > 0) G.bullets.push({ type: 'i', x, y: s.y - 30, vx: 0, vy: -700, hits: new Set(), mask: 0, inten, dmg: 0.3 * inten });
  }
  G.mlc = cols;
  for (const o of G.oars) depositOAR(o, 0.01, true); // low-dose scatter bath: the price of more MU
}

/* RapidArc: the ship orbits the patient and aims every beam at the target */
const ARC_DUR = 4;
function arcPath(th) {
  const b = G.st.body, ax = Math.min(b.rx + 28, 186), ay = b.ry + 42;
  return { x: b.cx + Math.cos(th) * ax, y: clamp(b.cy + Math.sin(th) * ay, HUD_H + 24, SHIP_MAX_Y) };
}
function arcTarget() {
  const t = G.tumors.find(u => u.alive && u.kind !== 'hidden');
  return t || { x: G.st.body.cx, y: G.st.body.cy };
}
function useArc() {
  if (!G || state !== 'play' || G.arc < 1 || G.arcT > 0 || G.clearT >= 0) return;
  G.arc = 0; G.arcT = ARC_DUR; G.arcFireT = 0; G.arcSave = { x: G.ship.x, y: G.ship.y };
  banner('RapidArc', '360° 회전 · 모든 방향에서 종양 조준', '#7ef3c8', 2);
}
function fireArc() {
  const s = G.ship, t = arcTarget(), d = dist(s.x, s.y, t.x, t.y) || 1;
  G.bullets.push({ type: 'a', x: s.x, y: s.y, vx: (t.x - s.x) / d * 760, vy: (t.y - s.y) / d * 760, hits: new Set(), mask: 0, dmg: 0.4 });
}

function nearestTarget(b) {
  let best = null, bd = 1e9;
  for (const t of G.tumors) if (t.alive && (t.kind !== 'hidden' || t.seen) && t.y < b.y) {
    const d = Math.abs(t.x - b.x) + (b.y - t.y) * 0.15; if (d < bd) { bd = d; best = t; }
  }
  for (const c of G.cells) if (!c.dead && c.y < b.y) {
    const d = Math.abs(c.x - b.x) + (b.y - c.y) * 0.15 + 20; if (d < bd) { bd = d; best = c; }
  }
  return best;
}

function updateBullets(dt) {
  const gating = charKey === 'therapist' && G.sp.active > 0;
  for (const b of G.bullets) {
    if (gating && (b.type === 'x' || b.type === 'e')) {
      const t = nearestTarget(b);
      if (t) b.vx += clamp((t.x - b.x) * 9 - b.vx, -2400, 2400) * dt * 4;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    const step = Math.hypot(b.vx, b.vy) * dt;
    if (b.travel !== undefined) b.travel += step;
    if (b.type !== 'w') addDose(b.x, b.y, step * (b.type === 'x' ? 0.0035 : b.type === 'e' ? 0.005 : b.type === 'i' ? 0.0035 * b.inten : b.type === 'a' ? 0.0025 : 0.001));
    if (b.type === 'p') {
      b.left -= step;
      if (b.left <= 0) { b.x = b.tx; b.y = b.ty; b.dead = true; protonExplode(b.tx, b.ty); continue; }
    }
    // organs
    if (b.type !== 'w') {
      for (let k = 0; k < G.oars.length; k++) {

      for (const t of G.tumors) {

    if (!b.dead && b.type !== 'p') {
      for (const c of G.cells) {
        if (!c.dead && !b.hits.has(c.id) && dist(b.x, b.y, c.x, c.y) < c.r + 2) {
          b.hits.add(c.id);
          if (b.type === 'x' || b.type === 'i' || b.type === 'a') hitCell(c, b.dmg != null ? b.dmg : 0.6);
          else if (b.type === 'e') { hitCell(c, 1.0); b.dead = true; break; }
          else if (b.type === 'w') { c.vy -= 150; c.slow = 1.2; hitCell(c, 0.15); b.dead = true; burst(b.x, b.y, '#7cc4ff', 3, 60); break; }

/* ============ update ============ */
function update(dt) {
  G.time += dt;
  const ending = state !== 'play';
  // particles & texts always
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const t of G.texts) { t.t += dt; t.y -= 18 * dt; }
  G.texts = G.texts.filter(t => t.t < 1.1);
  for (const b of G.booms) b.t += dt;
  G.booms = G.booms.filter(b => b.t < b.dur);
  for (const b of G.banners) b.t += dt;
  G.banners = G.banners.filter(b => b.t < b.dur);
  for (const o of G.oars) o.flash = Math.max(0, o.flash - dt);
  G.shake = Math.max(0, G.shake - dt);
  G.hintT -= dt;
  if (G.cross) {
    G.cross.t += dt;
    if (G.cross.queued && !G.pQueue) G.cross = null;
    else if (!G.cross.queued && G.cross.t > 0.9) G.cross = null;
  }
  if (ending) return;

  const s = G.ship;
  // RapidArc orbit (ship is driven by the gantry, not the player)
  if (G.arcT > 0) {
    G.arcT -= dt;
    const p = arcPath(Math.PI / 2 + (1 - Math.max(0, G.arcT) / ARC_DUR) * Math.PI * 2);
    s.x = p.x; s.y = p.y; s.inv = Math.max(s.inv, 0.05);
    G.arcFireT -= dt;
    if (G.arcFireT <= 0) { G.arcFireT = 0.06; fireArc(); }
    if (G.arcT <= 0 || G.clearT >= 0) { G.arcT = 0; s.x = G.arcSave.x; s.y = G.arcSave.y; }
  } else G.arc = Math.min(1, G.arc + dt / 25);
  const arcing = G.arcT > 0;
  // ship movement (keyboard)
  const spd = (charKey === 'therapist' ? 330 : 260) * dt;
  let kx = 0, ky = 0;
  if (keys.ArrowLeft || keys.KeyA) kx -= 1; if (keys.ArrowRight || keys.KeyD) kx += 1;
  if (keys.ArrowUp || keys.KeyW) ky -= 1; if (keys.ArrowDown || keys.KeyS) ky += 1;
  if (!arcing) { s.x = clamp(s.x + kx * spd, SHIP_MIN_X, SHIP_MAX_X); s.y = clamp(s.y + ky * spd, SHIP_MIN_Y, SHIP_MAX_Y); }

  if (ad >= 3 && !G.driftWarned) {
    G.driftWarned = true;
    banner(`Output ${G.drift > 0 ? '+' : ''}${G.drift.toFixed(1)}%`, '아침 QA 하셨죠? 물대포로 보정하세요', '#ffb347', 2.6);
  }
  if (ad < 2) G.driftWarned = false;

  }

    G.nextInterlock = charKey === 'physicist' ? rand(55, 75) : rand(26, 40);
  }
  G.interlock = Math.max(0, G.interlock - dt);

  // firing
  G.pCharge = Math.min(1, G.pCharge + dt / 1.6);
  if (G.pQueue && G.weapon !== 'p') G.pQueue = null;
  if (G.pQueue && G.pCharge >= 1 && G.interlock <= 0) fireP(G.pQueue.x, G.pQueue.y);
  G.waterOn = false;
  if (G.interlock <= 0 && !arcing) {
    G.fireT -= dt;
    if (G.weapon === 'x' && G.fireT <= 0) { G.fireT = 0.15; fireX(); }
    else if (G.weapon === 'i' && G.fireT <= 0) { G.fireT = 0.3; fireI(); }
    else if (G.weapon === 'e' && G.fireT <= 0) { G.fireT = 0.34; fireE(); }
    else if (G.weapon === 'p' && G.pCharge >= 1 && !G.pQueue) {

      const t = G.tumors.find(u => u.alive && u.kind !== 'hidden');
      if (t && t.y < G.ship.y - 30) fireP(t.x, t.y);
    }
    else if (G.weapon === 'w' && G.tank > 0) {

    }
  }
  if (G.waterOn) {
    G.tank = Math.max(0, G.tank - 22 * dt);

    s.hp = Math.min(100, s.hp + 6 * dt);

    }

    t.x = t.bx + dx; t.y = t.by + dy;
    if (charKey === 'doctor' && G.sp.active > 0) t.seen = true;

    // spawn cells

      spawnCell(t);
    }

        if (ph === 3) banner('GBM 3단계 — 저산소 코어', '산소가 없으면 방사선이 덜 먹힙니다 (선량 효과 −20%)', '#ff4d5e', 2.8);
      }
      if (G.time - t.lastHit > 1.5 && t.dose > 0) {
        t.dose = Math.max(0, t.dose - 1.6 * dt);
        t.regrowMsgT -= dt;
        if (t.regrowMsgT <= 0) { ftext(t.x, t.y - t.r - 18, '재증식 중…', '#ff9aa6', 11); t.regrowMsgT = 2.5; }
      }

        G.eb.push({ x: c.x, y: c.y, vx: (s.x - c.x) / d * 140, vy: (s.y - c.y) / d * 140, r: 3.5 });

    }
    if (dist(c.x, c.y, s.x, s.y) < c.r + 13) { c.dead = true; burst(c.x, c.y, '#ff7a8a', 8, 90); hurt(15, '충돌'); }
    else if (c.y > H + 6) { c.dead = true; G.stats.escaped++; ftext(c.x, H - 18, '전이!', '#ff4d5e', 12); hurt(8, '전이'); }
  }
  G.cells = G.cells.filter(c => !c.dead);

  for (const e of G.eb) {
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (dist(e.x, e.y, s.x, s.y) < e.r + 11) { e.dead = true; hurt(6, '피격'); }
    if (e.y > H + 10 || e.y < HUD_H || e.x < -10 || e.x > W + 10) e.dead = true;
  }
  G.eb = G.eb.filter(e => !e.dead);

  if (G.clearT >= 0) {
    G.clearT -= dt;
    if (G.clearT < 0) showResult();
  }
}

function spawnCell(t) {
  const a = rand(0.2, Math.PI - 0.2);
  const st = G.st;
  G.cells.push({
    id: uid++, x: t.x + Math.cos(a) * t.r * 0.8, y: t.y + Math.sin(a) * t.r * 0.8,
    vy: 10, sp: rand(st.cellSpeed[0], st.cellSpeed[1]), r: rand(6.5, 8.5),
    hp: st.cellHp, age: 0, ph: rand(0, 6), flash: 0,

function stageClear() {
  G.clearT = 1.6;
  for (const c of G.cells) { burst(c.x, c.y, '#ff7a8a', 6, 80); }

function gameOver(kind, o) {

/* ============ input ============ */

window.addEventListener('keydown', e => {

    ctx.globalAlpha = 1;
    const shield = charKey === 'physicist' && G.sp.active > 0;
    ctx.strokeStyle = shield ? '#9dffcf' : o.color; ctx.lineWidth = o.flash > 0 ? 2.4 : 1.4;
    if (shield) ctx.setLineDash([4, 3]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  // labels
  ctx.font = `600 8.5px ${FONT_UI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  for (const o of G.oars) {
    ctx.fillStyle = o.color; ctx.globalAlpha = 0.85;
    const ly = o.ry < 8 ? o.cy - o.ry - 3 : o.cy - o.ry + 11;
    ctx.fillText(o.name, o.cx, ly);
  }
  ctx.globalAlpha = 1;
}

function drawTumors() {
  const reveal = charKey === 'doctor' && G.sp.active > 0;
  for (const t of G.tumors) {
    if (!t.alive) continue;
    const f = t.dose / t.rx;
    if (t.kind === 'hidden') {
      if (!reveal && !t.seen) continue;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,120,220,${0.18 + f * 0.4})`; ctx.fill();
      ctx.setLineDash([3, 2]); ctx.strokeStyle = '#ff9be0'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
      if (reveal) label(t.x, t.y - t.r - 8, `미세 ${t.dose.toFixed(0)}/${t.rx}`, '#ff9be0', 8);
      continue;
    }
    // tissue mass
    blobPath(t, 1.0); ctx.fillStyle = 'rgba(120,70,75,.55)'; ctx.fill();
    // isodose wash
    if (f > 0.02) {
      const [r, g, b] = isoColor(f);
      blobPath(t, 0.92); ctx.fillStyle = `rgba(${r},${g},${b},${0.2 + f * 0.4})`; ctx.fill();
    }
    blobPath(t, 1.0);
    ctx.strokeStyle = t.flash > 0 ? '#fff' : '#ff3b4f'; ctx.lineWidth = 2; ctx.stroke();
    // PTV margin
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 1.32, 0, Math.PI * 2);
    ctx.setLineDash(reveal ? [6, 3] : [2, 4]); ctx.strokeStyle = reveal ? '#ff9be0' : 'rgba(255,90,110,.55)'; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
    if (charKey === 'therapist' && G.sp.active > 0) {
      ctx.strokeStyle = 'rgba(77,214,255,.8)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(t.x - t.r - 10, t.y); ctx.lineTo(t.x + t.r + 10, t.y); ctx.moveTo(t.x, t.y - t.r - 10); ctx.lineTo(t.x, t.y + t.r + 10); ctx.stroke();
    }
    const col = t.kind === 'boss' && t.phase === 3 ? '#ffb0b8' : '#ffd0d6';
    label(t.x, t.y - t.r * 1.32 - 9, `${t.label} ${t.dose.toFixed(1)} / ${t.rx} Gy`, col, 9);
    if (t.kind === 'boss') {
      ctx.font = `700 10px ${FONT_NUM}`; ctx.fillStyle = '#ff6b78'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('★'.repeat(t.phase) + '☆'.repeat(3 - t.phase), t.x, t.y + t.r * 1.32 + 4);
    }
  }
}

function drawCells() {
  for (const c of G.cells) {
    const pulse = 1 + Math.sin(c.age * 6 + c.ph) * 0.06;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = c.flash > 0 ? '#fff' : (c.shooter ? 'rgba(190,90,230,.55)' : 'rgba(255,90,110,.45)'); ctx.fill();
    ctx.strokeStyle = c.shooter ? '#d79bff' : '#ff8a98'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(c.x + 1, c.y - 1, c.r * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = c.shooter ? '#6a2a8a' : '#8a1f2c'; ctx.fill();
  }
}

function drawBullets() {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of G.bullets) {
    if (b.type === 'x') {
      const gr = ctx.createLinearGradient(b.x, b.y, b.x - b.vx * 0.022, b.y + 16);
      gr.addColorStop(0, 'rgba(230,255,255,1)'); gr.addColorStop(1, 'rgba(60,200,255,0)');
      ctx.strokeStyle = gr; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.022, b.y + 16); ctx.stroke();
    } else if (b.type === 'e') {
      const a = 1 - b.travel / b.range;
      ctx.fillStyle = `rgba(170,150,255,${0.35 + a * 0.65})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, Math.PI * 2); ctx.fill();
    } else if (b.type === 'i') {
      ctx.strokeStyle = `rgba(126,243,200,${0.3 + b.inten * 0.7})`; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y + 13); ctx.stroke();
    } else if (b.type === 'a') {
      const sp = Math.hypot(b.vx, b.vy) || 1;
      ctx.strokeStyle = 'rgba(160,255,215,.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / sp * 14, b.y - b.vy / sp * 14); ctx.stroke();
    } else if (b.type === 'w') {
      ctx.fillStyle = 'rgba(90,170,255,.8)';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.4, 0, Math.PI * 2); ctx.fill();
    } else if (b.type === 'p') {
      const gr = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 9);
      gr.addColorStop(0, 'rgba(255,240,210,1)'); gr.addColorStop(0.4, 'rgba(255,130,80,.8)'); gr.addColorStop(1, 'rgba(255,80,60,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,140,90,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.04, b.y - b.vy * 0.04); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawShip(x, y, accent, t, alpha, rot) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.globalAlpha = alpha == null ? 1 : alpha;
  // engine glow
  const fl = 0.8 + Math.sin(t * 30) * 0.2;
  const gr = ctx.createRadialGradient(0, 24, 0, 0, 24, 16 * fl);
  gr.addColorStop(0, 'rgba(120,255,240,.9)'); gr.addColorStop(1, 'rgba(47,211,197,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 24, 16 * fl, 0, Math.PI * 2); ctx.fill();
  // gantry arms (wings)
  ctx.fillStyle = '#8fa3b0';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 9, -2); ctx.lineTo(s * 27, 10); ctx.lineTo(s * 27, 19); ctx.lineTo(s * 9, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = accent; ctx.fillRect(s * 27 - (s > 0 ? 3 : 0), 10, 3, 9); ctx.fillStyle = '#8fa3b0';
  }
  // body (treatment head)
  const bg = ctx.createLinearGradient(-14, 0, 14, 0);
  bg.addColorStop(0, '#c7d3da'); bg.addColorStop(0.5, '#f4f8fa'); bg.addColorStop(1, '#a9b9c3');
  ctx.fillStyle = bg; rr(ctx, -14, -14, 28, 38, 7); ctx.fill();
  // collimator
  ctx.fillStyle = '#26323b';
  ctx.beginPath(); ctx.moveTo(-9, -13); ctx.lineTo(-6, -25); ctx.lineTo(6, -25); ctx.lineTo(9, -13); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7ef3e8'; ctx.fillRect(-3.5, -26, 7, 2.4);
  // character stripe
  ctx.fillStyle = accent; ctx.fillRect(-14, 17, 28, 3);
  // DosiCare mark badge
  ctx.beginPath(); ctx.arc(0, 3, 11.5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#2a4e78'; ctx.lineWidth = 1; ctx.stroke();
  if (markImg.complete && markImg.naturalWidth) ctx.drawImage(markImg, -10, -7, 20, 20);
  ctx.restore();
}

function drawHUD() {
  const g = ctx;
  g.fillStyle = 'rgba(8,11,15,.94)'; g.fillRect(0, 0, W, HUD_H);
  g.fillStyle = '#25333d'; g.fillRect(0, HUD_H - 1, W, 1);
  const c = CHARS[charKey];
  // row 1
  g.textBaseline = 'middle'; g.textAlign = 'left';
  g.font = `700 10px ${FONT_NUM}`; g.fillStyle = '#2fd3c5'; g.fillText(G.st.fx + ' / 3', 10, 17);
  g.font = `700 14px ${FONT_UI}`; g.fillStyle = '#dbe5ea'; g.fillText(G.st.short, 58, 17);
  const nameW = g.measureText(G.st.short).width;
  g.font = `600 9px ${FONT_UI}`;
  const chipX = 66 + nameW, cw = g.measureText(c.name).width + 14;
  g.strokeStyle = c.accent; g.lineWidth = 1; rr(g, chipX, 10, cw, 14, 7); g.stroke();
  g.fillStyle = c.accent; g.fillText(c.name, chipX + 7, 17.5);
  g.textAlign = 'right'; g.font = `700 13px ${FONT_NUM}`; g.fillStyle = '#dbe5ea';
  g.fillText(G.score.toLocaleString('en-US'), W - 52, 17);
  g.font = `500 8px ${FONT_NUM}`; g.fillStyle = '#7f919d'; g.fillText('SCORE', W - 52, 29);
  // row 2: hp + output
  g.textAlign = 'left'; g.font = `600 9px ${FONT_UI}`; g.fillStyle = '#7f919d'; g.fillText('장비', 10, 40);
  g.fillStyle = '#1d2830'; rr(g, 34, 36, 130, 8, 4); g.fill();
  const hp = G.ship.hp / 100;
  g.fillStyle = hp > 0.5 ? '#2fd3c5' : hp > 0.25 ? '#ffb347' : '#ff4d5e'; rr(g, 34, 36, Math.max(4, 130 * hp), 8, 4); g.fill();
  g.font = `600 9px ${FONT_NUM}`; g.fillStyle = '#dbe5ea'; g.fillText(Math.ceil(G.ship.hp) + '%', 168, 40);
  const ad = Math.abs(G.drift), oc = ad >= 6 ? '#ff4d5e' : ad >= 3 ? '#ffb347' : '#7f919d';
  g.fillStyle = '#7f919d'; g.font = `600 9px ${FONT_UI}`; g.fillText('Output', 206, 40);
  g.font = `700 10px ${FONT_NUM}`; g.fillStyle = oc;
  g.fillText(`${G.drift >= 0 ? '+' : '−'}${ad.toFixed(1)}%`, 244, 40);
  // drift bar (-8..+8)
  g.fillStyle = '#1d2830'; g.fillRect(292, 38, 56, 4);
  g.fillStyle = '#3a4a55'; g.fillRect(319.5, 35, 1, 10);
  const dx = clamp(G.drift / 8, -1, 1) * 28;
  g.fillStyle = oc; g.fillRect(dx >= 0 ? 320 : 320 + dx, 38, Math.abs(dx), 4);
  // row 3: OAR gauges
  const n = G.oars.length, gw = (W - 20 - (n - 1) * 8) / n;
  G.oars.forEach((o, k) => {
    const x = 10 + k * (gw + 8), f = Math.min(1, o.dose / o.limit);
    g.textAlign = 'left'; g.font = `600 9px ${FONT_UI}`; g.fillStyle = o.color; g.fillText(o.name, x, 60);
    g.textAlign = 'right'; g.font = `600 8.5px ${FONT_NUM}`; g.fillStyle = f > 0.85 ? '#ff4d5e' : '#b9c7cf';
    g.fillText(`${o.dose.toFixed(1)}/${o.limit}`, x + gw, 60);
    g.fillStyle = '#1d2830'; rr(g, x, 68, gw, 6, 3); g.fill();
    g.fillStyle = f > 0.85 ? '#ff4d5e' : f > 0.6 ? '#ffb347' : o.color;
    if (f > 0) { rr(g, x, 68, Math.max(3, gw * f), 6, 3); g.fill(); }
  });
  g.textAlign = 'left'; g.font = `500 7.5px ${FONT_NUM}`; g.fillStyle = '#56656f';
  g.fillText('OAR 선량 제한 (Gy) — 넘으면 플랜 반려', 10, 86);
}

function drawBanners() {
  G.banners.forEach((b, k) => {
    const a = Math.min(1, b.t / 0.15, (b.dur - b.t) / 0.3);
    const y = HUD_H + 22 + k * 40;
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = `700 13px ${FONT_UI}`;
    const w1 = ctx.measureText(b.text).width;
    ctx.font = `500 9.5px ${FONT_UI}`;
    const w = Math.max(w1, ctx.measureText(b.sub).width) + 24;
    ctx.fillStyle = 'rgba(6,9,12,.86)'; rr(ctx, W / 2 - w / 2, y - 14, w, b.sub ? 34 : 24, 6); ctx.fill();
    ctx.strokeStyle = b.color; ctx.lineWidth = 1; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 13px ${FONT_UI}`; ctx.fillStyle = b.color; ctx.fillText(b.text, W / 2, y - 2);
    if (b.sub) { ctx.font = `500 9.5px ${FONT_UI}`; ctx.fillStyle = '#c9d5dc'; ctx.fillText(b.sub, W / 2, y + 12); }
    ctx.globalAlpha = 1;
  });
}

function render() {
  const g = ctx;
  g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (!G) { renderAttract(); return; }
  g.save();
  if (G.shake > 0) g.translate(rand(-3, 3) * G.shake * 4, rand(-3, 3) * G.shake * 4);
  g.drawImage(ctImg, 0, 0, W, H);
  drawMotes(performance.now() / 1000);
  drawDoseWash();
  drawRoomDecor();
  drawOARs();
  drawTumors();
  drawCells();
  // light field guide
  const s = G.ship, c = CHARS[charKey];
  if (state === 'play' && (G.weapon === 'x') && G.interlock <= 0) {
    const lg = g.createLinearGradient(0, s.y - 30, 0, HUD_H);
    lg.addColorStop(0, 'rgba(126,243,232,.16)'); lg.addColorStop(1, 'rgba(126,243,232,0)');
    g.fillStyle = lg; g.fillRect(s.x - 3, HUD_H, 6, s.y - 30 - HUD_H);
  }
  drawBullets();
  for (const e of G.eb) {
    g.beginPath(); g.arc(e.x, e.y, e.r, 0, Math.PI * 2); g.fillStyle = '#ff9a5a'; g.fill();
    g.strokeStyle = 'rgba(255,200,150,.6)'; g.lineWidth = 1; g.stroke();
  }
  for (const b of G.booms) {
    const k = b.t / b.dur;
    g.beginPath(); g.arc(b.x, b.y, b.r * (0.3 + k * 0.7), 0, Math.PI * 2);
    g.strokeStyle = b.color; g.globalAlpha = 1 - k; g.lineWidth = 3 * (1 - k) + 1; g.stroke();
    if (b.bragg && k < 0.6) {
      g.fillStyle = 'rgba(255,170,110,.25)'; g.fill();
      g.font = `700 8px ${FONT_NUM}`; g.fillStyle = '#ffd2b0'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('BRAGG PEAK', b.x, b.y - b.r - 6);
    }
    g.globalAlpha = 1;
  }
  for (const p of G.parts) {
    g.globalAlpha = Math.max(0, p.life / p.max); g.fillStyle = p.color;
    g.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  g.globalAlpha = 1;
  // ship
  if (state === 'play' || state === 'paused' || (state === 'ending' && G.overKind === 'oar') || G.clearT >= 0 || state === 'result') {
    const arcing = G.arcT > 0;
    if (arcing) {
      // gantry path + progress
      const b = G.st.body, ax = Math.min(b.rx + 28, 186), ay = b.ry + 42, prog = 1 - G.arcT / ARC_DUR;
      g.setLineDash([3, 5]); g.strokeStyle = 'rgba(126,243,200,.35)'; g.lineWidth = 1;
      g.beginPath(); g.ellipse(b.cx, b.cy, ax, ay, 0, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      g.strokeStyle = 'rgba(126,243,200,.9)'; g.lineWidth = 2.4;
      g.beginPath(); g.ellipse(b.cx, b.cy, ax, ay, 0, Math.PI / 2, Math.PI / 2 + prog * Math.PI * 2); g.stroke();
      g.font = `700 9px ${FONT_NUM}`; g.fillStyle = '#bfffe6'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(`GANTRY ${Math.round((180 + prog * 360) % 360)}°`, b.cx, b.cy + ay - 14);
    }
    const blink = !arcing && s.inv > 0 && Math.floor(s.inv * 16) % 2 === 0;
    let rot = 0;
    if (arcing) { const t = arcTarget(); rot = Math.atan2(t.y - s.y, t.x - s.x) + Math.PI / 2; }
    drawShip(s.x, s.y, c.accent, G.time, blink ? 0.35 : 1, rot);
    if (G.weapon === 'i' && !arcing && G.mlc) {
      // MLC leaves above the collimator: open = lit, closed = steel
      for (let k = 0; k < 7; k++) {
        const lx = s.x + (k - 3) * 9 - 4, ly = s.y - 40, f = G.mlc[k];
        g.fillStyle = '#5d6b76'; g.fillRect(lx, ly, 8, 7);
        if (f > 0) { g.fillStyle = `rgba(126,243,200,${0.35 + 0.6 * f})`; const gw = 8 * f; g.fillRect(lx + (8 - gw) / 2, ly, gw, 7); }
        g.strokeStyle = '#26323b'; g.lineWidth = 0.6; g.strokeRect(lx, ly, 8, 7);
      }
    }
    if (charKey === 'physicist' && G.sp.active > 0) {
      g.beginPath();
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + G.time; const px = s.x + Math.cos(a) * 34, py = s.y + Math.sin(a) * 34; k ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.closePath(); g.strokeStyle = 'rgba(255,194,77,.85)'; g.lineWidth = 1.6; g.stroke();
      g.fillStyle = 'rgba(255,194,77,.08)'; g.fill();
    }
  }
  // proton crosshair
  if (G.weapon === 'p' && state === 'play') {
    g.strokeStyle = G.pCharge >= 1 ? 'rgba(255,138,92,.9)' : 'rgba(255,138,92,.35)'; g.lineWidth = 1;
    g.beginPath(); g.arc(s.x, s.y - 26, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * G.pCharge); g.stroke();
  }
  if (G.cross && G.cross.queued) {
    // reserved shot: dashed ring that fills as the charge completes
    const c = G.cross;
    g.setLineDash([4, 4]); g.strokeStyle = 'rgba(255,170,120,.55)'; g.lineWidth = 1.2;
    g.beginPath(); g.arc(c.x, c.y, 26, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    g.strokeStyle = 'rgba(255,170,120,.95)'; g.lineWidth = 2;
    g.beginPath(); g.arc(c.x, c.y, 26, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * G.pCharge); g.stroke();
    g.font = `700 8px ${FONT_NUM}`; g.fillStyle = '#ffd2b0'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('예약', c.x, c.y);
  } else if (G.cross) {
    const k = G.cross.t / 0.9;
    g.strokeStyle = `rgba(255,170,120,${1 - k})`; g.lineWidth = 1.2;
    g.beginPath(); g.arc(G.cross.x, G.cross.y, 26, 0, Math.PI * 2);
    g.moveTo(G.cross.x - 32, G.cross.y); g.lineTo(G.cross.x + 32, G.cross.y);
    g.moveTo(G.cross.x, G.cross.y - 32); g.lineTo(G.cross.x, G.cross.y + 32); g.stroke();
  }
  for (const t of G.texts) {
    g.globalAlpha = Math.max(0, 1 - t.t / 1.1);
    g.font = `700 ${t.size}px ${FONT_UI}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(t.text, t.x, t.y);
    g.fillStyle = t.color; g.fillText(t.text, t.x, t.y);
  }
  g.globalAlpha = 1;
  g.restore();

  // hints
  if (G.hintT > 0 && state === 'play') {
    g.globalAlpha = Math.min(1, G.hintT);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 13px ${FONT_UI}`; g.fillStyle = '#e8fffd'; g.fillText(G.st.hint[0], W / 2, 478);
    g.font = `500 10px ${FONT_UI}`; g.fillStyle = '#9fb3be'; g.fillText(G.st.hint[1], W / 2, 652);
    g.globalAlpha = 1;
  }
  // interlock
  if (G.interlock > 0 && state === 'play') {
    g.fillStyle = 'rgba(255,40,60,.08)'; g.fillRect(0, HUD_H, W, H - HUD_H);
    const y = 448;
    g.fillStyle = 'rgba(40,6,10,.92)'; rr(g, 30, y - 18, W - 60, 36, 6); g.fill();
    g.strokeStyle = '#ff4d5e'; g.lineWidth = 1; g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 11px ${FONT_NUM}`; g.fillStyle = '#ff6b78'; g.fillText('INTERLOCK', W / 2, y - 6);
    g.font = `600 10px ${FONT_UI}`; g.fillStyle = '#ffd5d9'; g.fillText(G.interlockMsg + ' · 리셋 중', W / 2, y + 8);
  }
  drawBanners();
  drawHUD();
}

let attractCT = null;
function renderAttract() {
  if (!attractCT) attractCT = buildCT(STAGES[0]);
  const t = performance.now() / 1000;
  ctx.globalAlpha = 0.75; ctx.drawImage(attractCT, 0, 0, W, H); ctx.globalAlpha = 1;
  drawMotes(t);
  const y = 120 + ((t * 60) % 340);
  ctx.fillStyle = 'rgba(47,211,197,.12)'; ctx.fillRect(0, y, W, 2);
  ctx.strokeStyle = '#ff3b4f'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(115 + Math.sin(t * 1.6) * 10, 255 + Math.sin(t * 1.6 + 0.6) * 7, 20, 0, Math.PI * 2); ctx.stroke();
  drawShip(115 + Math.sin(t * 1.6) * 10, 585 + Math.sin(t * 2) * 4, '#2fd3c5', t, 1);
}

/* ============ screens ============ */
const scr = $('#screen');
function show(html) { scr.innerHTML = html; scr.hidden = false; scr.scrollTop = 0; $('#pause').hidden = true; }
function hide() { scr.hidden = true; $('#pause').hidden = false; }

function showTitle() {
  state = 'title'; G = null;
  show(`
    <div class="brand"><img src="${LOGO}" alt="DosiCare — Expertise &amp; Support"></div>
    <h1 class="logo">암 퇴치 작전</h1>
    <div class="tag">Linac Flight Unit · v1.3/div>
    <p class="lead">리니악 비행선을 몰고 환자 몸속으로.<br>암에는 처방선량을, 정상 장기에는 최소 선량을.</p>
    <div class="panel">
      <div class="kv"><span>암 체력</span><b>처방선량 (Gy)</b></div>
      <div class="kv"><span>지는 조건</span><b>장기 선량 초과 · 장비 다운</b></div>
      <div class="kv"><span>치료 횟수</span><b>3 Fx</b></div>
    </div>
    <button class="btn" id="go">시작</button>
    <p class="dim" style="text-align:center;font-size:.72em">숫자는 게임용으로 단순화한 값입니다. 실제 임상 기준이 아닙니다.</p>`);
  $('#go').onclick = showSelect;
}

function showSelect() {
  state = 'select';
  const cards = Object.entries(CHARS).map(([k, c]) => `
    <button class="card${charKey === k ? ' sel' : ''}" data-k="${k}" style="--ca:${c.accent}" type="button">
      ${avatarSVG(k)}
      <div><div class="cn">${c.name}<span class="cr">${c.role}</span></div>
      <div class="cs"><b>${c.special}</b> · ${c.sdesc}</div>
      <div class="cp">평소: ${c.passive}</div></div>
    </button>`).join('');
  show(`<h3>출동 인원 선택</h3><h2>누가 빔을 켤까요?</h2><div class="cards">${cards}</div>
    <button class="btn" id="go" ${charKey ? '' : 'disabled'}>이 사람으로 출동</button>`);
  scr.querySelectorAll('.card').forEach(b => b.onclick = () => {
    charKey = b.dataset.k;
    scr.querySelectorAll('.card').forEach(x => x.classList.toggle('sel', x === b));
    $('#go').disabled = false;
  });
  $('#go').onclick = () => { totalScore = 0; setSpecialUI(); showIntro(0); };
}

function showIntro(i) {
  startStage(i);
  state = 'intro';
  const st = STAGES[i];
  const chips = st.oars.map(o => `<span class="chip" style="--c:${o.color}">${o.name} ≤ ${o.limit} Gy</span>`).join('');
  const tum = st.tumors[0];
  show(`<div class="fx">${st.fx} / 3</div><h2>${st.title}</h2>
    <p>${st.intro}</p>
    <div class="panel">
      <div class="kv"><span>${tum.label} 처방</span><b>${tum.rx} Gy</b></div>
      <div class="chips">${chips}</div>
      <p class="dim" style="font-size:.8em">${st.tip}</p>
    </div>
    <button class="btn" id="go">Beam On</button>`);
  $('#go').onclick = () => { hide(); state = 'play'; };
}

function gradeOf(maxR, hiddenAll) {
  if (maxR < 0.6 && hiddenAll) return ['A', '플랜 승인', '교수님이 이 플랜을 학회 발표에 쓰자고 하십니다.', '#2fd3c5'];
  if (maxR < 0.6) return ['B', '승인', '장기 보호는 훌륭합니다. 숨은 미세 병변을 놓쳐서 A는 아닙니다.', '#9fd8ff'];
  if (maxR < 0.8) return ['B', '승인', '무난합니다. 차트 정리하고 다음 환자 부르세요.', '#9fd8ff'];
  return ['C', '겨우 승인', '물리팀이 한숨을 쉬며 재검토 메모를 남겼습니다.', '#ffb347'];
}

function showResult() {
  state = 'result';
  const hid = G.tumors.filter(t => t.kind === 'hidden');
  const hidDone = hid.filter(t => !t.alive).length;
  let maxR = 0, oarBonus = 0;
  const rows = G.oars.map(o => {
    const f = o.dose / o.limit; maxR = Math.max(maxR, f); oarBonus += Math.round((1 - Math.min(1, f)) * 800);
    const col = f > 0.85 ? '#ff4d5e' : f > 0.6 ? '#ffb347' : o.color;
    return `<div class="dvh"><span style="color:${o.color}">${o.name}</span><span class="bar"><i style="width:${(Math.min(1, f) * 100).toFixed(0)}%;background:${col}"></i></span><span class="v">${o.dose.toFixed(1)} / ${o.limit}</span></div>`;
  }).join('');
  const hpBonus = Math.round(G.ship.hp * 10);
  const bonus = oarBonus + hpBonus;
  totalScore = G.score + bonus;
  const [gr, gt, gd, gc] = gradeOf(maxR, hidDone === hid.length);
  const last = G.i === STAGES.length - 1;
  show(`<div class="fx">${G.st.fx} 완료 · ${G.st.short}</div>
    <div class="row" style="align-items:center;gap:.9em"><div class="grade" style="color:${gc}">${gr}</div><div><h2 style="font-size:1.4em">${gt}</h2><p class="dim">${gd}</p></div></div>
    <div class="panel"><h3>장기별 최대 선량 (Gy)</h3>${rows}</div>
    <div class="panel">
      <div class="kv"><span>미세 병변 치료</span><b>${hidDone} / ${hid.length}</b></div>
      <div class="kv"><span>잡은 암세포 · 놓친 세포</span><b>${G.stats.cells} · ${G.stats.escaped}</b></div>
      <div class="kv"><span>장비 상태</span><b>${Math.ceil(G.ship.hp)}%</b></div>
      <div class="kv"><span>장기 보호 + 장비 보너스</span><b>+${bonus.toLocaleString('en-US')}</b></div>
    </div>
    <div class="big">${totalScore.toLocaleString('en-US')}</div>
    <button class="btn" id="go">${last ? '치료 종료' : '다음 치료 (' + STAGES[G.i + 1].fx + ')'}</button>`);
  $('#go').onclick = () => last ? showVictory() : showIntro(G.i + 1);
}

function showOver() {
  state = 'over';
  let title, why, joke;
  if (G.overKind === 'oar') {
    const o = G.overOar;
    title = '플랜 반려';
    why = `${o.name} 선량 제한 ${o.limit} Gy 초과`;
    joke = o.name === '척수' ? '척수는 한 번 넘으면 끝입니다. 사고 보고서 쓰러 가세요.'
      : o.name.includes('수정체') ? '환자분이 내년에 백내장 수술을 받으시게 됐습니다.'
      : o.name === '직장' ? '소화기내과에서 전화가 왔습니다. 받으시겠어요?'
      : '선량 제약을 다시 확인하고 플랜을 새로 짜세요.';
  } else {
    title = '장비 다운';
    why = '리니악 상태 0%';
    joke = '서비스 엔지니어 도착까지 4시간… 대기실 환자분들 표정이 어둡습니다.';
  }
  show(`<div class="fx">${G.st.fx} · ${G.st.short}</div><h2 style="color:#ff4d5e">${title}</h2>
    <p><b>${why}</b></p><p class="dim">${joke}</p>
    <div class="row"><button class="btn" id="re">이 치료 다시</button><button class="btn ghost" id="home">처음으로</button></div>`);
  $('#re').onclick = () => { totalScore = stageStartScore; showIntro(G.i); };
  $('#home').onclick = showTitle;
}

function showVictory() {
  state = 'victory';
  const c = CHARS[charKey];
  show(`<div class="tag">Course complete · 3 / 3 Fx</div><h2 style="text-align:center">전 과정 치료 완료</h2>
    <div style="width:6em;margin:0 auto">${avatarSVG(charKey)}</div>
    <p class="lead">환자분 퇴원하십니다.<br><span class="dim">다음 외래: 3개월 뒤 추적 CT</span></p>
    <div class="big">${totalScore.toLocaleString('en-US')}</div>
    <p class="dim" style="text-align:center">${c.name} 덕분에 오늘도 정시 퇴근… 은 아니고 30분 초과.</p>
    <div class="brand sm"><img src="${LOGO}" alt="DosiCare"></div>
    <div class="row"><button class="btn" id="again">다른 사람으로 다시</button><button class="btn ghost" id="home">처음으로</button></div>`);
  $('#again').onclick = showSelect;
  $('#home').onclick = showTitle;
}

function pauseGame() {
  if (state !== 'play') return;
  state = 'paused';
  show(`<h3>Beam Off</h3><h2>일시정지</h2>
    <div class="panel"><p class="dim" style="font-size:.82em">조작: 끌어서 이동 · 빔 자동 · 양성자는 자동 조준, 톡 하면 그 자리로<br>PC: 방향키/WASD 이동 · 1–5 무기 · Space 특기 · R RapidArc · P 일시정지</p></div>
    <button class="btn" id="res">계속하기</button><button class="btn ghost" id="quit">그만하고 처음으로</button>`);
  $('#res').onclick = resumeGame;
  $('#quit').onclick = showTitle;
}
function resumeGame() { if (state === 'paused') { hide(); state = 'play'; } }

/* ============ loop ============ */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  if (G && (state === 'play' || state === 'ending')) update(dt);
  render();
  if (state === 'play') updateBarUI();
  requestAnimationFrame(frame);
}

layout();
showTitle();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
</script>
</body>
</html>
